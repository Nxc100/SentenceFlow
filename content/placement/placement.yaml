      - { w: "me", ipa: "miː", pos: "pron" }
      - { w: "please", ipa: "pliːz", pos: "adv" }
    chunks:
      - { r: "marker", i: [0] }
      - { r: "subj", i: [1] }
      - { r: "pred", i: [2] }
      - { r: "obj", i: [3] }
      - { r: "marker", i: [4] }
