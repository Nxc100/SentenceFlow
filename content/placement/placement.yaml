# 定级测试题库 — 单一事实源(《英语水平定级测试-实现方案》§3.2)
# `sf factory build` 按级 spec 校验(词表带/句长/成分覆盖)后打进 content.db
# 的 meta["placement"];校验不过则构建失败。
version: 1

vocab:
  # 词汇快筛分层(NGSL band 上界,升序);真词运行时从 lemma 表按层抽样
  strata: [300, 600, 1100, 1600, 2200, 2800]
  per_stratum: 3
  pseudo_count: 6
  # 伪词:符合英语音系、不在词表内(构建期校验),用于猜测校正
  pseudowords:
    - plore
    - tandle
    - brastic
    - mefty
    - clander
    - strule
    - dremp
    - quimble
    - prilt
    - shonter
    - velpid
    - crandle

# 各级定级句(每级 8 句):词汇难度由该级词表带保证,语法按各级白名单递进
sentences:
  # ---------------- L1(≤500 词带,≤8 词):be 现在时 / 一般现在 / 简单疑问
  - level: L1
    en: "I am a new student."
    zh: "我是一名新学生。"
    scene: "定级"
    pattern: "主+系+表"
    words:
      - { w: "I", ipa: "aɪ", pos: "pron" }
      - { w: "am", ipa: "æm", pos: "aux" }
      - { w: "a", ipa: "ə", pos: "art" }
      - { w: "new", ipa: "njuː", pos: "adj" }
      - { w: "student", ipa: "ˈstjuːdənt", pos: "n" }
    chunks:
      - { r: "subj", i: [0] }
      - { r: "link", i: [1] }
      - { r: "comp", i: [2, 3, 4] }
  - level: L1
    en: "She is my good friend."
    zh: "她是我的好朋友。"
    scene: "定级"
    pattern: "主+系+表"
    words:
      - { w: "She", ipa: "ʃiː", pos: "pron" }
      - { w: "is", ipa: "ɪz", pos: "aux" }
      - { w: "my", ipa: "maɪ", pos: "pron" }
      - { w: "good", ipa: "ɡʊd", pos: "adj" }
      - { w: "friend", ipa: "frend", pos: "n" }
    chunks:
      - { r: "subj", i: [0] }
      - { r: "link", i: [1] }
      - { r: "comp", i: [2, 3, 4] }
  - level: L1
    en: "We go to school today."
    zh: "我们今天去上学。"
    scene: "定级"
    pattern: "主+谓+状"
    words:
      - { w: "We", ipa: "wiː", pos: "pron" }
      - { w: "go", ipa: "ɡəʊ", pos: "v" }
      - { w: "to", ipa: "tuː", pos: "prep" }
      - { w: "school", ipa: "skuːl", pos: "n" }
      - { w: "today", ipa: "təˈdeɪ", pos: "adv" }
    chunks:
      - { r: "subj", i: [0] }
      - { r: "pred", i: [1] }
      - { r: "advl", i: [2, 3] }
      - { r: "advl", i: [4] }
  - level: L1
    en: "What is your name?"
    zh: "你叫什么名字？"
    scene: "定级"
    pattern: "特殊疑问句"
    words:
      - { w: "What", ipa: "wɒt", pos: "wh" }
      - { w: "is", ipa: "ɪz", pos: "aux" }
      - { w: "your", ipa: "jɔː", pos: "pron" }
      - { w: "name", ipa: "neɪm", pos: "n" }
    chunks:
      - { r: "marker", i: [0] }
      - { r: "link", i: [1] }
      - { r: "subj", i: [2, 3] }
  - level: L1
    en: "I like this book."
    zh: "我喜欢这本书。"
    scene: "定级"
    pattern: "主+谓+宾"
    words:
      - { w: "I", ipa: "aɪ", pos: "pron" }
      - { w: "like", ipa: "laɪk", pos: "v" }
      - { w: "this", ipa: "ðɪs", pos: "pron" }
      - { w: "book", ipa: "bʊk", pos: "n" }
    chunks:
      - { r: "subj", i: [0] }
      - { r: "pred", i: [1] }
      - { r: "obj", i: [2, 3] }
  - level: L1
