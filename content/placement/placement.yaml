# 边界语法题:考察相邻两级 grammar_whitelist 的增量语法点,二选一
grammar:
  # L1/L2 边界:can / 现在进行 / There be / 祈使
  - { lo: L1, hi: L2, topic_zh: "can 和现在进行时", prompt_zh: "我会游泳。", stem: "I ___ swim.", options: ["can", "am"], answer: 0 }
  - { lo: L1, hi: L2, topic_zh: "can 和现在进行时", prompt_zh: "她正在看电视。", stem: "She is ___ TV.", options: ["watch", "watching"], answer: 1 }
  - { lo: L1, hi: L2, topic_zh: "can 和现在进行时", prompt_zh: "桌上有一本书。", stem: "___ is a book on the table.", options: ["There", "Here"], answer: 0 }
