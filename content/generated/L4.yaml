    scene: "交换联系方式"
    func: ""
    pattern: "There be + 名词"
    note: "没信号时解释为什么加不上联系方式。"
    words:
      - { w: "There", ipa: "ðeə", pos: "pron" }
      - { w: "is", ipa: "ɪz", pos: "aux" }
      - { w: "no", ipa: "nəʊ", pos: "art" }
      - { w: "signal", ipa: "ˈsɪɡnəl", pos: "n" }
      - { w: "here", ipa: "hɪə", pos: "adv" }
    chunks:
      - { r: "marker", i: [0] }
