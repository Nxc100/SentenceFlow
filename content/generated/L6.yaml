    note: "get a fade 是「做渐变发型」的地道说法。"
    words:
      - { w: "I", ipa: "aɪ", pos: "pron" }
      - { w: "usually", ipa: "ˈjuːʒuəli", pos: "adv" }
      - { w: "get", ipa: "ɡet", pos: "v" }
      - { w: "a", ipa: "ə", pos: "art" }
      - { w: "fade", ipa: "feɪd", pos: "n" }
      - { w: "every", ipa: "ˈevri", pos: "adj" }
      - { w: "month", ipa: "mʌnθ", pos: "n" }
