# AI 生成的出厂句(L6,1037 句)
# 由 `sf factory harvest` 从 generated.db 收上来,并与文件里
# 已有的句子合并(同文以这次收的为准,不是整体重写)。
# 手改这个文件是可以的(人工抽审改错句就直接改这里);
# 但重新 harvest 会按 场景→英文 排序重排,别在这里加自己的注释。
level: L6
sentences:
  - en: "Although the timeline is tight, I believe we can deliver on schedule."
    zh: "尽管工期紧，但我相信我们能按时交付。"
    scene: "会议发言"
    func: ""
    pattern: "让步状语从句 + 主句"
    note: "Although 从句前置表示让步，主句表达确信。"
    words:
      - { w: "Although", ipa: "ɔːlˈðəʊ", pos: "conj" }
      - { w: "the", ipa: "ðə", pos: "art" }
      - { w: "timeline", ipa: "ˈtaɪmlaɪn", pos: "n" }
      - { w: "is", ipa: "ɪz", pos: "v" }
      - { w: "tight", ipa: "taɪt", pos: "adj" }
      - { w: "I", ipa: "aɪ", pos: "pron" }
      - { w: "believe", ipa: "bɪˈliːv", pos: "v" }
      - { w: "we", ipa: "wiː", pos: "pron" }
      - { w: "can", ipa: "kæn", pos: "modal" }
      - { w: "deliver", ipa: "dɪˈlɪvə", pos: "v" }
      - { w: "on", ipa: "ɒn", pos: "prep" }
      - { w: "schedule", ipa: "ˈʃedjuːl", pos: "n" }
    chunks:
      - { r: "marker", i: [0] }
      - { r: "subj", i: [1, 2] }
      - { r: "pred", i: [3, 4] }
      - { r: "subj", i: [5] }
      - { r: "pred", i: [6] }
      - { r: "obj", i: [7, 8, 9, 10, 11] }
  - en: "Could we perhaps revisit the budget allocation for Q3?"
    zh: "我们能否重新审视一下第三季度的预算分配？"
    scene: "会议发言"
    func: ""
    pattern: "礼貌建议 could + perhaps + 动词"
    note: "Could we perhaps… 语气最委婉，适合会议中提出敏感建议。"
    words:
      - { w: "Could", ipa: "kʊd", pos: "modal" }
      - { w: "we", ipa: "wiː", pos: "pron" }
      - { w: "perhaps", ipa: "pəˈhæps", pos: "adv" }
      - { w: "revisit", ipa: "riːˈvɪzɪt", pos: "v" }
      - { w: "the", ipa: "ðə", pos: "art" }
      - { w: "budget", ipa: "ˈbʌdʒɪt", pos: "n" }
      - { w: "allocation", ipa: "ˌæləˈkeɪʃn", pos: "n" }
      - { w: "for", ipa: "fɔː", pos: "prep" }
      - { w: "Q3", ipa: "kjuː θriː", pos: "propn" }
    chunks:
      - { r: "marker", i: [0] }
      - { r: "subj", i: [1] }
      - { r: "advl", i: [2] }
      - { r: "pred", i: [3] }
      - { r: "obj", i: [4, 5, 6] }
      - { r: "advl", i: [7, 8] }
  - en: "Could you clarify what the next steps should be?"
    zh: "能否请您明确一下后续步骤是什么？"
