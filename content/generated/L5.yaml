    scene: "交换联系方式"
    func: ""
    pattern: "情态动词疑问句"
    note: "scan a code 表示「扫码」。"
    words:
      - { w: "Can", ipa: "kæn", pos: "modal" }
      - { w: "I", ipa: "aɪ", pos: "pron" }
      - { w: "scan", ipa: "skæn", pos: "v" }
      - { w: "your", ipa: "jɔː", pos: "pron" }
      - { w: "QR", ipa: "kjuː ɑː", pos: "propn" }
      - { w: "code", ipa: "kəʊd", pos: "n" }
    chunks:
      - { r: "marker", i: [0] }
      - { r: "subj", i: [1] }
      - { r: "pred", i: [2] }
      - { r: "obj", i: [3, 4, 5] }
