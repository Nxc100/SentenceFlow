# AI 生成的出厂句(L5,297 句)
# 由 `sf factory harvest` 从 generated.db 收上来。
# 手改这个文件是可以的(人工抽审改错句就直接改这里);
# 但重新 harvest 会按 场景→英文 排序覆盖,别在这里加自己的注释。
