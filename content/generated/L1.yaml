    scene: "告别与约下次"
    func: ""
    pattern: "be 动词一般现在疑问句"
    note: "now 表示现在。"
    words:
      - { w: "Are", ipa: "ɑː", pos: "aux" }
      - { w: "they", ipa: "ðeɪ", pos: "pron" }
      - { w: "free", ipa: "friː", pos: "adj" }
      - { w: "now", ipa: "naʊ", pos: "adv" }
    chunks:
      - { r: "link", i: [0] }
      - { r: "subj", i: [1] }
      - { r: "comp", i: [2] }
      - { r: "advl", i: [3] }
