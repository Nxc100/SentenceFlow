# AI 生成的出厂句(L1,1096 句)
# 由 `sf factory harvest` 从 generated.db 收上来,并与文件里
# 已有的句子合并(同文以这次收的为准,不是整体重写)。
# 手改这个文件是可以的(人工抽审改错句就直接改这里);
# 但重新 harvest 会按 场景→英文 排序重排,别在这里加自己的注释。
level: L1
