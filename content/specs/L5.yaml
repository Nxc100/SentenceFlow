# LevelSpec L5 (spec §4.9)
id: L5
cefr: "B1"
vocab_band: 2800
max_words: 16
grammar_whitelist:
  - be_present
  - present_simple
  - simple_question
  - can_modal
  - present_continuous
  - there_be
  - imperative
  - past_simple
  - comparative
  - adverbs_frequency
  - future_will
  - future_going_to
  - infinitive
  - object_clause
  - present_perfect       # +现在完成
  - conditional           # 条件句
  - passive               # 被动
can_do:
  - "表达观点"
  - "处理投诉"
practice:
  flow: mixed                   # 打字/听打混合
  review_listening_ratio: 0.4
  dictation_min_box: 3          # 盒 ≥3 进默写
  hints:
    ipa: hidden                 # 无提示
    first_letter: false
    zh_hideable: true           # 中文可隐
  judge:
    strict: true
    track_article_preposition: true   # 冠介专项统计
  srs:
    daily_new_default: 25
    daily_new_range: [5, 50]
    review_cap: 60
    box_intervals_days: [1, 3, 7, 14]
    box5_recheck_days: 21       # 盒 5 抽检加频
    listening_weight: 1.5
