# 出厂句库的场景清单 —— W6 全量生产(≈5000 句)的覆盖面定义。
#
# 每条 = 一个场景;`levels` 列出该场景要在哪几级产内容。产量看下面的
# `targets`,不是"一个槽位一批" —— 见那里的说明。
#
# 等级适配的取舍:同一个话题在不同等级问的东西不一样 —— L1 的「餐厅」是
# "我要一杯水",L5 的「餐厅」是"这道菜里有花生吗?我朋友过敏"。所以
# `levels` 不是"这个话题有多难",而是"这个话题在哪几级值得各出一批"。
#
# 生产前先跑 `sf factory scan --scenes content/scenes.yaml`:它按清单逐个
# 场景试产一小批,把「词表外 / 越带」的词汇总出来,一次性补进
# `content/lexicon/supplement.tsv`,免得 5000 句跑到一半才发现某个领域
# 的词全在词表外(实测:医疗场景 fever/headache/sore 全部不在 NGSL 内)。

version: 1

# 每级出厂句数目标(合计 5000,W6 出口标准)。
#
# 场景清单定的是**覆盖面**,这里定的是**产量**:某级的批次数 =
# ceil(目标 ÷ 该级场景数 ÷ 每批句数)。低等级场景少但每个场景可写的
# 说法多(L1 的「问候」有几十种变体),高等级反过来 —— 所以不强求
# 每个「场景×等级」只出一批。
targets:
  L1: 700
  L2: 800
  L3: 900
  L4: 900
  L5: 900
  L6: 800

