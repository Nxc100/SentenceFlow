# 种子句库 L2 — 购物 / 问价 / 问路 / 日常(格式见 content/seed/README.md)
level: L2
sentences:
  - en: "How much is this red shirt?"
    zh: "这件红色的衬衫多少钱？"
    scene: "问价"
    func: "询问价格"
    pattern: "特殊疑问句"
    note: "问价格用 How much is…?"
    words:
      - { w: "How", ipa: "haʊ", pos: "wh" }
      - { w: "much", ipa: "mʌtʃ", pos: "adj" }
      - { w: "is", ipa: "ɪz", pos: "aux" }
      - { w: "this", ipa: "ðɪs", pos: "pron" }
      - { w: "red", ipa: "red", pos: "adj" }
      - { w: "shirt", ipa: "ʃɜːt", pos: "n" }
    chunks:
      - { r: "marker", i: [0, 1] }
      - { r: "link", i: [2] }
      - { r: "subj", i: [3, 4, 5] }

  - en: "Can I try it on?"
    zh: "我能试穿一下吗？"
    scene: "购物"
    func: "请求试穿"
    pattern: "一般疑问句"
    note: "try on 表示试穿,代词放中间。"
    words:
      - { w: "Can", ipa: "kæn", pos: "modal" }
      - { w: "I", ipa: "aɪ", pos: "pron" }
      - { w: "try", ipa: "traɪ", pos: "v" }
      - { w: "it", ipa: "ɪt", pos: "pron" }
      - { w: "on", ipa: "ɒn", pos: "adv" }
    chunks:
      - { r: "marker", i: [0] }
      - { r: "subj", i: [1] }
      - { r: "pred", i: [2, 4] }
      - { r: "obj", i: [3] }

  - en: "The shoes are too expensive."
    zh: "这双鞋太贵了。"
    scene: "购物"
    func: "评价价格"
    pattern: "主+系+表"
    note: "too 加形容词表示\"太…了\"。"
    words:
      - { w: "The", ipa: "ðə", pos: "art" }
      - { w: "shoes", ipa: "ʃuːz", pos: "n" }
      - { w: "are", ipa: "ɑː", pos: "aux" }
      - { w: "too", ipa: "tuː", pos: "adv" }
      - { w: "expensive", ipa: "ɪkˈspensɪv", pos: "adj" }
    chunks:
      - { r: "subj", i: [0, 1] }
      - { r: "link", i: [2] }
      - { r: "comp", i: [3, 4] }

  - en: "I am looking for a blue bag."
    zh: "我想找一个蓝色的包。"
    scene: "购物"
    func: "说明来意"
    pattern: "现在进行时"
    note: "look for 表示寻找。"
    words:
      - { w: "I", ipa: "aɪ", pos: "pron" }
      - { w: "am", ipa: "æm", pos: "aux" }
      - { w: "looking", ipa: "ˈlʊkɪŋ", pos: "v" }
      - { w: "for", ipa: "fɔː", pos: "prep" }
      - { w: "a", ipa: "ə", pos: "art" }
      - { w: "blue", ipa: "bluː", pos: "adj" }
      - { w: "bag", ipa: "bæɡ", pos: "n" }
    chunks:
      - { r: "subj", i: [0] }
      - { r: "pred", i: [1, 2, 3] }
      - { r: "obj", i: [4, 5, 6] }

  - en: "There is a big sale today."
