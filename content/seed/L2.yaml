      - { w: "is", ipa: "ɪz", pos: "aux" }
      - { w: "a", ipa: "ə", pos: "art" }
      - { w: "big", ipa: "bɪɡ", pos: "adj" }
      - { w: "sale", ipa: "seɪl", pos: "n" }
      - { w: "today", ipa: "təˈdeɪ", pos: "adv" }
