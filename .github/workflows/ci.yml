name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Tauri Linux build deps
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy (core crates)
        run: cargo clippy -p sf-core -p sf-license -p sf-pipeline -p sf-llm --all-features -- -D warnings
      # content/build/ 是构建产物不入库,但 tauri-build 会在编译期校验
      # bundle.resources 里的 content.db 路径 —— 测试前先从种子库产出它。
      - name: Build bundled content.db (from seeds)
        run: cargo run -p sf-pipeline --features factory --bin sf -- factory build
      - name: Tests
        run: cargo test --workspace --all-features
      - name: sf-wasm compiles for wasm32
        run: cargo check -p sf-wasm --target wasm32-unknown-unknown
      - name: Gold regression (seed content)
        run: cargo run -p sf-pipeline --features factory --bin sf -- gold run --content-dir content

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # 试用站的 wasm 引擎不入库(避免与 sf-core 悄悄漂移),CI 现场构建。
      - name: Build sf-wasm engine
        run: npm run build:wasm
      - name: Typecheck
        run: npx tsc --noEmit -p packages/ui && npx tsc --noEmit -p apps/web-trial && npx tsc --noEmit -p apps/desktop
      # 四套主题的对比度体检:阈值取浅色主题实测基线,新主题不许把哪一对压到线下。
      - name: Theme contrast check
        run: npm run check:theme
      - name: Build web trial
        run: npm run build:trial
      - name: Build desktop frontend
        run: npm run build --workspace apps/desktop
