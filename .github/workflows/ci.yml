name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Tauri Linux build deps
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy (core crates)
        run: cargo clippy -p sf-core -p sf-license -p sf-pipeline -p sf-llm --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: sf-wasm compiles for wasm32
        run: cargo check -p sf-wasm --target wasm32-unknown-unknown
      - name: Gold regression (seed content)
        run: cargo run -p sf-pipeline --features factory --bin sf -- gold run --content-dir content

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p packages/ui && npx tsc --noEmit -p apps/web-trial && npx tsc --noEmit -p apps/desktop
      - name: Build web trial
        run: npm run build:trial
      - name: Build desktop frontend
        run: npm run build --workspace apps/desktop
