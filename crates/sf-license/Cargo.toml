[package]
name = "sf-license"
description = "Offline licensing: .sflic payload, Ed25519 verification (client) and issuing (feature `issuer`, builds the vendor-only CLI). No activation server (spec §7.6)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
# issuer-only deps
rand = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = []
# Builds the signing side + `sf-license` CLI. Never enabled in shipped apps.
issuer = ["dep:rand", "dep:clap", "dep:anyhow"]

[[bin]]
name = "sf-license"
required-features = ["issuer"]
path = "src/bin/issuer.rs"
