[package]
name = "sentenceflow-desktop"
description = "SentenceFlow desktop shell (Tauri 2): commands, rusqlite storage, channel orchestration, licensing (spec §7)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "sentenceflow_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sf-core = { workspace = true }
sf-pipeline = { workspace = true, features = ["store"] }
sf-llm = { workspace = true }
sf-license = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true }
keyring = { workspace = true }
secrecy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = [] }
# 智能体工作目录的系统文件夹选择器(显式 command,不经插件 — 见 capabilities)
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# 删除智能体会话时把工作目录移入系统回收站(可找回,比直接抹掉安全)
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# opencode 一键安装器:npm registry 流式下载 + tgz 解包
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
