[workspace]
resolver = "3"
members = [
    "crates/sf-core",
    "crates/sf-pipeline",
    "crates/sf-llm",
    "crates/sf-license",
    "crates/sf-wasm",
    "apps/desktop/src-tauri",
]
# `cargo test` compiles the Tauri shell too; use `-p <crate>` during focused
# core work to skip it.

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://example.invalid/sentenceflow"
authors = ["SentenceFlow"]
rust-version = "1.85"

[workspace.dependencies]
sf-core = { path = "crates/sf-core" }
sf-pipeline = { path = "crates/sf-pipeline" }
sf-llm = { path = "crates/sf-llm" }
sf-license = { path = "crates/sf-license" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
secrecy = "0.10"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Fast iterative builds for the heavy desktop app during development.
[profile.dev.package."*"]
opt-level = 1
